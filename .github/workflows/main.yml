name: Build mod jar

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show what is in the repo
        run: |
          echo "=== Files in repo ==="
          find . -path ./.git -prune -o -type f -print | sort

      - name: Find project folder and check sources
        run: |
          GRADLE_FILE=$(find . -path ./.git -prune -o -name build.gradle -print | head -n1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "::error::No build.gradle found anywhere in the repo. Upload build.gradle, gradle.properties, settings.gradle and the src folder."
            exit 1
          fi
          ROOT=$(dirname "$GRADLE_FILE")
          echo "Project root: $ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          COUNT=$(find "$ROOT/src" -name '*.java' 2>/dev/null | wc -l)
          echo "Java source files found: $COUNT"
          if [ "$COUNT" -lt 8 ]; then
            echo "::error::Only $COUNT .java files found under $ROOT/src (expected 11). The src folder was not uploaded correctly. Need src/main/java/dev/actest/ACTestClient.java etc."
            exit 1
          fi
          test -f "$ROOT/src/main/resources/fabric.mod.json" || { echo "::error::src/main/resources/fabric.mod.json is missing"; exit 1; }

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Build
        run: gradle -p "$ROOT" build --no-daemon

      - name: Collect jar and check contents
        run: |
          mkdir -p dist
          for f in "$ROOT"/build/libs/*.jar; do
            case "$f" in *-sources.jar) ;; *) cp "$f" dist/ ;; esac
          done
          ls -la dist
          JAR=$(ls dist/*.jar | head -n1)
          echo "=== Contents of $JAR ==="
          unzip -l "$JAR"
          unzip -l "$JAR" | grep -q "fabric.mod.json"
          unzip -l "$JAR" | grep -q "ClickGuiScreen"
          unzip -l "$JAR" | grep -q "assets/actest/lang/en_us.json"

      - name: Upload jar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: actest-jar
          path: dist/*.jar

      - name: Publish release with jar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AC Test build ${{ github.run_number }}
          body: Download the .jar below and put it in .minecraft/mods with Fabric API.
          files: dist/*.jar
